<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Worksheet continuation QA</title></head><body><pre id="report">RUNNING</pre><iframe id="frame" title="Test page" style="width:390px;height:844px;border:0"></iframe><script>
(async()=>{
 const frame=document.getElementById('frame'), report=document.getElementById('report'), results=[];
 const pause=()=>new Promise(r=>setTimeout(r,60));
 function check(name,value){results.push({name,pass:!!value});if(!value)throw new Error(name)}
 async function load(path){await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(new Error('load timeout '+path)),15000);frame.onload=()=>{clearTimeout(timeout);resolve()};frame.src=path});await pause();return frame.contentWindow}
 function set(w,id,value){const el=w.document.getElementById(id);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));el.dispatchEvent(new w.Event('change',{bubbles:true}))}
 const key=k=>'lukagrowth.worksheet.v1.'+k;
 try{
 let w=await load('/tools/export-readiness.html');w.confirm=()=>true;w.localStorage.removeItem(key('readiness'));
 set(w,'product','持久化测试产品');set(w,'unknown','交期尚未确认');set(w,'next','补产品参数');
 check('no implicit save',w.localStorage.getItem(key('readiness'))===null);
 w.document.getElementById('save-draft').click();let saved=JSON.parse(w.localStorage.getItem(key('readiness')));check('explicit save',saved.fields.product==='持久化测试产品');
 w=await load('/tools/export-readiness.html');w.confirm=()=>true;check('no auto restore',w.document.getElementById('product').value==='');w.document.getElementById('restore-draft').click();check('restored after reload',w.document.getElementById('product').value==='持久化测试产品');
 set(w,'product','未保存的新修改');check('edits do not overwrite draft',JSON.parse(w.localStorage.getItem(key('readiness'))).fields.product==='持久化测试产品');
 w.confirm=()=>false;w.document.getElementById('restore-draft').click();check('cancel restore preserves edits',w.document.getElementById('product').value==='未保存的新修改');w.confirm=()=>true;
 w.document.getElementById('load-example').click();check('example loads',w.document.getElementById('product').value.includes('虚拟示例'));check('example does not overwrite saved draft',JSON.parse(w.localStorage.getItem(key('readiness'))).fields.product==='持久化测试产品');
 w.document.getElementById('worksheet').requestSubmit();check('example provenance in output',w.document.getElementById('result-text').value.includes('虚拟教学示例'));check('example provenance in summary',w.document.getElementById('consultation-text').value.includes('虚拟教学示例'));
 w.document.getElementById('save-draft').click();w=await load('/tools/export-readiness.html');w.confirm=()=>true;w.document.getElementById('restore-draft').click();check('example flag survives restore',!w.document.getElementById('example-status').hidden);
 w.document.getElementById('clear-form').click();check('clear resets example flag',w.document.getElementById('example-status').hidden);check('clear preserves saved draft',w.localStorage.getItem(key('readiness'))!==null);
 set(w,'product','不能丢的输入');w.localStorage.setItem(key('readiness'),'{broken');w.document.getElementById('restore-draft').click();check('corrupt draft preserves input',w.document.getElementById('product').value==='不能丢的输入');
 const raw=JSON.stringify({...saved,version:999});w.localStorage.setItem(key('readiness'),raw);w.document.getElementById('restore-draft').click();check('unknown draft version is rejected',w.document.getElementById('product').value==='不能丢的输入');
 const setItem=w.Storage.prototype.setItem;w.Storage.prototype.setItem=function(){throw new w.DOMException('Quota exceeded','QuotaExceededError')};w.document.getElementById('save-draft').click();check('storage denial is explained',w.document.getElementById('draft-status').textContent.includes('保存失败'));check('storage denial preserves input',w.document.getElementById('product').value==='不能丢的输入');w.Storage.prototype.setItem=setItem;
 w.document.getElementById('delete-draft').click();check('delete removes only draft',w.localStorage.getItem(key('readiness'))===null&&w.document.getElementById('product').value==='不能丢的输入');
 set(w,'unknown','需要确认交期');set(w,'next','先补资料');set(w,'product-owner','私有负责人名字');w.document.getElementById('worksheet').requestSubmit();check('summary contains useful questions',w.document.getElementById('consultation-text').value.includes('需要确认交期'));check('summary omits internal owner',!w.document.getElementById('consultation-text').value.includes('私有负责人名字'));
 Object.defineProperty(w.navigator,'clipboard',{value:{writeText:()=>Promise.reject(new Error('denied'))},configurable:true});w.document.getElementById('copy-consultation').click();await pause();check('summary copy failure fallback',w.document.getElementById('consultation-status').textContent.includes('手动复制'));
 w=await load('/tools/buyer-record.html');w.confirm=()=>true;w.localStorage.removeItem(key('buyer'));w.document.getElementById('load-example').click();w.document.getElementById('worksheet').requestSubmit();check('buyer example admits no contact',w.document.getElementById('result-text').value.includes('尚未联系'));check('buyer example complete',w.document.getElementById('stage').value==='待确认');w.document.getElementById('save-draft').click();check('tools use separate draft keys',w.localStorage.getItem(key('buyer'))!==null&&w.localStorage.getItem(key('readiness'))===null);
 w=await load('/tools/export-budget.html');w.confirm=()=>true;w.localStorage.removeItem(key('budget'));w.document.getElementById('load-example').click();check('budget example has 3 costs',w.document.querySelectorAll('.cost-item').length===3);w.document.getElementById('worksheet').requestSubmit();let out=w.document.getElementById('result-text').value;check('budget example CNY plan',out.includes('计划：1700.00'));check('budget example unpaid',out.includes('可确认待付：700.00'));check('budget example separates USD',out.includes('USD（1 项）'));check('unconfirmed cost stays unknown',out.includes('确认报价：待确认'));
 w.document.getElementById('save-draft').click();w=await load('/tools/export-budget.html');w.confirm=()=>true;w.document.getElementById('restore-draft').click();check('restore dynamic cost rows',w.document.querySelectorAll('.cost-item').length===3);check('restore currencies',w.document.getElementById('cost-3-currency').value==='USD');check('restore blank amount',w.document.getElementById('cost-2-confirmed').value==='');
 let blob;w.URL.createObjectURL=b=>{blob=b;return 'blob:test'};w.HTMLAnchorElement.prototype.click=function(){};set(w,'cost-1-item','=SUM(1,2)');w.document.getElementById('download-csv').click();let csv=await blob.text();check('CSV formula text escaped',csv.includes("\"'=SUM(1,2)\""));check('CSV has currency summaries',csv.includes('币种汇总')&&csv.includes('1700.00'));check('CSV missing amounts explicit',csv.includes('待确认'));check('CSV example label',csv.includes('虚拟教学示例'));
 w.document.getElementById('delete-draft').click();check('budget draft deleted',w.localStorage.getItem(key('budget'))===null);check('other tool draft preserved',w.localStorage.getItem(key('buyer'))!==null);
 for(const width of [375,390,768,1280]){frame.style.width=width+'px';for(const path of ['/','/about-luka.html','/tools/','/tools/export-readiness.html','/tools/buyer-record.html','/tools/export-budget.html','/case-apparel.html','/guide-export-team.html']){w=await load(path);check(`${width} no overflow ${path}`,w.document.documentElement.scrollWidth<=w.innerWidth);check(`one mobile contact ${path}`,w.document.querySelectorAll('.mobile-contact').length===1);if(width>600)check(`desktop contact bar hidden ${path}`,w.getComputedStyle(w.document.querySelector('.mobile-contact')).display==='none')}}
 frame.style.width='390px';w=await load('/tools/export-budget.html');check('mobile contact bar visible at top',w.getComputedStyle(w.document.querySelector('.mobile-contact')).display==='grid');w.document.getElementById('scope').focus();await pause();check('mobile contact hides while typing',w.getComputedStyle(w.document.querySelector('.mobile-contact')).display==='none');w.document.getElementById('scope').blur();await pause();check('mobile contact returns after typing',w.getComputedStyle(w.document.querySelector('.mobile-contact')).display==='grid');w.document.getElementById('contact').scrollIntoView({behavior:'instant',block:'start'});await new Promise(r=>setTimeout(r,300));check('mobile bar hides at contact panel',w.getComputedStyle(w.document.querySelector('.mobile-contact')).display==='none');
 report.textContent=JSON.stringify({status:'PASS',count:results.length},null,2);
 }catch(e){report.textContent=JSON.stringify({status:'FAIL',error:e.message,count:results.length,failed:results.filter(r=>!r.pass)},null,2)}
})();
</script></body></html>
